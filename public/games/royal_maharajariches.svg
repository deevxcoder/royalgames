<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="50%" stop-color="#1b032e" />
      <stop offset="100%" stop-color="#0b0114" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="20" />
  <circle cx="200" cy="140" r="130" fill="url(#sunburst)" />

  <!-- Gold Border Frame -->
  <rect x="8" y="8" width="384" height="284" rx="16" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.8" />
  <rect x="14" y="14" width="372" height="272" rx="12" fill="none" stroke="#FDE047" stroke-width="1" opacity="0.4" />

  <!-- Royal Symbols Display -->
  <!-- Golden Ganesha in Center -->
  <g transform="translate(140, 50) scale(1.2)">
    <circle cx="50" cy="50" r="42" fill="#78350F" opacity="0.5" />
    <!-- Crown -->
    <polygon points="50,10 70,30 30,30" fill="#F59E0B" stroke="#FFF" stroke-width="1" />
    <circle cx="50" cy="20" r="3" fill="#EC4899" />
    <!-- Ears -->
    <path d="M 30 32 C 12 28 8 48 16 60 C 24 68 32 62 30 50 Z" fill="#F59E0B" />
    <path d="M 70 32 C 88 28 92 48 84 60 C 76 68 68 62 70 50 Z" fill="#F59E0B" />
    <!-- Face & Trunk -->
    <path d="M 32 36 C 32 20 68 20 68 36 C 70 48 64 64 56 68 C 54 78 58 88 50 94 C 44 98 42 86 46 76 C 36 66 30 50 32 36 Z" fill="#FBBF24" stroke="#FFF" stroke-width="1.5" />
  </g>

  <!-- Left Lotus & Peacock -->
  <g transform="translate(30, 90) scale(0.7)">
    <circle cx="50" cy="50" r="35" fill="#EC4899" opacity="0.8" />
    <path d="M 50 82 C 34 68 34 32 44 14 C 48 36 50 60 50 82 Z" fill="#F472B6" />
    <path d="M 50 82 C 66 68 66 32 56 14 C 52 36 50 60 50 82 Z" fill="#F472B6" />
  </g>

  <!-- Right Diya & Taj Mahal -->
  <g transform="translate(300, 90) scale(0.7)">
    <path d="M 50 10 C 42 22 40 34 46 44 C 48 48 52 48 54 44 C 60 34 58 22 50 10 Z" fill="#F59E0B" />
    <path d="M 16 52 Q 50 48 84 52 C 86 68 76 80 50 82 C 24 80 14 68 16 52 Z" fill="#FBBF24" />
  </g>

  <!-- Bottom Title Banner -->
  <rect x="40" y="225" width="320" height="48" rx="14" fill="#0c0413" stroke="#F59E0B" stroke-width="2" />
  <text x="200" y="255" fill="url(#goldText)" font-family="Georgia, serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3">
    MAHARAJA RICHES
  </text>
  <text x="200" y="268" fill="#FDE047" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="2">
    3D ROYAL CASINO SLOTS • 20 PAYLINES
  </text>
</svg>

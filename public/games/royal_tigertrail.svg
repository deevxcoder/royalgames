<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tigerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="50%" stop-color="#04120d" />
      <stop offset="100%" stop-color="#020805" />
    </linearGradient>
    <linearGradient id="goldTiger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <filter id="tigerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#tigerBg)" />

  <!-- Jungle Fireflies & Ambient Glow -->
  <circle cx="90" cy="80" r="2" fill="#34d399" opacity="0.6" filter="url(#tigerGlow)" />
  <circle cx="220" cy="50" r="3" fill="#fde047" opacity="0.8" filter="url(#tigerGlow)" />
  <circle cx="480" cy="110" r="2" fill="#34d399" opacity="0.5" />
  <circle cx="510" cy="70" r="2.5" fill="#fde047" opacity="0.7" filter="url(#tigerGlow)" />

  <!-- River Stream & Glowing Stepping Stones -->
  <path d="M 0 260 Q 300 240, 600 280 L 600 360 L 0 360 Z" fill="#042f2e" opacity="0.4" />
  
  <!-- Stepping Stones -->
  <ellipse cx="140" cy="280" rx="35" ry="16" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#tigerGlow)" />
  <text x="140" y="284" fill="#34d399" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">1.25x</text>

  <ellipse cx="270" cy="265" rx="38" ry="17" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#tigerGlow)" />
  <text x="270" y="270" fill="#34d399" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">2.85x</text>

  <ellipse cx="410" cy="245" rx="42" ry="19" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" filter="url(#tigerGlow)" />
  <text x="410" y="250" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">16.0x</text>

  <ellipse cx="530" cy="225" rx="38" ry="18" fill="#1e293b" stroke="#f43f5e" stroke-width="2.5" filter="url(#tigerGlow)" />
  <text x="530" y="230" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">65.0x</text>

  <!-- Majestic Leaping Cyber Tiger Silhouette -->
  <g transform="translate(320, 110) scale(0.95)" filter="url(#tigerGlow)">
    <path d="M -80 30 Q -40 -30, 20 -10 Q 60 -40, 85 -20 Q 95 0, 75 25 Q 50 15, 20 30 Q -20 20, -50 45 Q -70 55, -80 30 Z" fill="url(#goldTiger)" />
    <!-- Tiger Glowing Eyes & Stripes -->
    <circle cx="75" cy="-8" r="3" fill="#ffffff" />
    <path d="M 40 -15 L 45 5 M 20 -10 L 22 15 M -10 -5 L -8 18 M -40 5 L -35 25" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Category & Multiplier Badges -->
  <rect x="30" y="30" width="130" height="24" rx="12" fill="#042f2e" stroke="#34d399" stroke-width="1" opacity="0.9" />
  <text x="95" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">STEP CASHOUT</text>

  <text x="30" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="1">TIGER TRAIL</text>
  <text x="30" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Mystical Jungle Stepper</text>
  
  <rect x="470" y="30" width="100" height="28" rx="10" fill="#14532d" stroke="#34d399" stroke-width="1" />
  <text x="520" y="49" fill="#86efac" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">MAX 500x</text>
</svg>

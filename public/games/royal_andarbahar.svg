<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2b1d" />
      <stop offset="60%" stop-color="#05140d" />
      <stop offset="100%" stop-color="#020805" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Felt Arena -->
  <rect width="400" height="300" fill="url(#bg)" rx="24" />
  <rect x="12" y="12" width="376" height="276" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" rx="18" />

  <!-- Dual Glowing Zones (Andar vs Bahar) -->
  <!-- ANDAR (Left Cyan) -->
  <rect x="35" y="150" width="150" height="85" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  <text x="110" y="185" fill="#38bdf8" font-size="15" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">ANDAR</text>
  <text x="110" y="212" fill="#7dd3fc" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">1.92x</text>

  <!-- BAHAR (Right Orange) -->
  <rect x="215" y="150" width="150" height="85" rx="14" fill="#c2410c" fill-opacity="0.25" stroke="#fb923c" stroke-width="2" filter="url(#glow)" />
  <text x="290" y="185" fill="#fb923c" font-size="15" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">BAHAR</text>
  <text x="290" y="212" fill="#fdba74" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">1.95x</text>

  <!-- Center Joker Card Pedestal -->
  <rect x="160" y="45" width="80" height="95" rx="8" fill="#ffffff" stroke="url(#gold)" stroke-width="3" filter="url(#glow)" />
  <text x="172" y="70" fill="#dc2626" font-size="16" font-family="monospace" font-weight="bold">K</text>
  <text x="172" y="85" fill="#dc2626" font-size="14">♥</text>
  <text x="200" y="100" fill="#dc2626" font-size="34" text-anchor="middle">♥</text>
  <text x="228" y="130" fill="#dc2626" font-size="16" font-family="monospace" font-weight="bold" text-anchor="end">K</text>

  <!-- Golden Crown & Game Title Header -->
  <text x="200" y="32" fill="url(#gold)" font-size="14" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="3">👑 ANDAR BAHAR ROYALE</text>

  <!-- Live Synchronized Badge -->
  <rect x="145" y="255" width="110" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="160" cy="267" r="4" fill="#34d399" />
  <text x="202" y="271" fill="#6ee7b7" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">LIVE MULTI</text>
</svg>

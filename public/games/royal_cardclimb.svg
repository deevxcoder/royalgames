<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="50%" stop-color="#02120e" />
      <stop offset="100%" stop-color="#010604" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#cardBg)" />

  <!-- 3D Luxury Playing Cards on Felt (Right side) -->
  <g transform="translate(380, 160)" filter="url(#cardGlow)">
    <!-- Back Card (Ace of Spades) -->
    <g transform="translate(-40, -20) rotate(-12)">
      <rect x="-45" y="-65" width="90" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
      <text x="-32" y="-42" font-family="serif" font-size="16" font-weight="bold" fill="#000000">A</text>
      <text x="-32" y="-26" font-size="14" fill="#000000">♠</text>
      <text x="0" y="15" font-size="36" text-anchor="middle" fill="#000000">♠</text>
      <text x="32" y="52" font-family="serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">A</text>
    </g>

    <!-- Front Card (King of Hearts) -->
    <g transform="translate(35, 10) rotate(14)">
      <rect x="-45" y="-65" width="90" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
      <text x="-32" y="-42" font-family="serif" font-size="16" font-weight="bold" fill="#dc2626">K</text>
      <text x="-32" y="-26" font-size="14" fill="#dc2626">♥</text>
      <text x="0" y="15" font-size="36" text-anchor="middle" fill="#dc2626">♥</text>
      <text x="32" y="52" font-family="serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="end">K</text>
    </g>
  </g>

  <!-- Badges & Titles -->
  <rect x="30" y="30" width="135" height="24" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1" opacity="0.9" />
  <text x="97" y="46" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">HI-LO CARDS</text>

  <text x="30" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="1">CARD CLIMB</text>
  <text x="30" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Luxury Hi-Lo Felt Prediction Table</text>
  
  <rect x="470" y="30" width="100" height="28" rx="10" fill="#042f2e" stroke="#34d399" stroke-width="1" />
  <text x="520" y="49" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">MAX 120x</text>
</svg>

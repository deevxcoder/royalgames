<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="infBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140728" />
      <stop offset="50%" stop-color="#0b0317" />
      <stop offset="100%" stop-color="#04010a" />
    </linearGradient>
    <filter id="infGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#infBg)" />

  <!-- Stars & Space Warp -->
  <circle cx="80" cy="80" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="160" cy="50" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="500" cy="70" r="2" fill="#c084fc" opacity="0.8" />
  <circle cx="520" cy="240" r="1.5" fill="#38bdf8" opacity="0.5" />

  <!-- Giant Glowing Infinity Lemniscate in Center Right -->
  <g transform="translate(380, 180) scale(1.1)" filter="url(#infGlow)">
    <!-- Infinity Track -->
    <path d="M 0 0 C 40 -40, 80 -40, 80 0 C 80 40, 40 40, 0 0 C -40 -40, -80 -40, -80 0 C -80 40, -40 40, 0 0 Z" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.4" />
    <path d="M 0 0 C 40 -40, 80 -40, 80 0 C 80 40, 40 40, 0 0 C -40 -40, -80 -40, -80 0 C -80 40, -40 40, 0 0 Z" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Quantum Energy Spheres Orbiting -->
    <circle cx="65" cy="-20" r="7" fill="#fbbf24" filter="url(#infGlow)" />
    <circle cx="-65" cy="20" r="7" fill="#34d399" filter="url(#infGlow)" />
    <circle cx="0" cy="0" r="10" fill="#f43f5e" filter="url(#infGlow)" />
  </g>

  <!-- Badges & Titles -->
  <rect x="30" y="30" width="135" height="24" rx="12" fill="#3b0764" stroke="#c084fc" stroke-width="1" opacity="0.9" />
  <text x="97" y="46" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">QUANTUM LIMBO</text>

  <text x="30" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="1">INFINITY X</text>
  <text x="30" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Hyperspace Target Multiplier</text>
  
  <rect x="460" y="30" width="110" height="28" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="515" y="49" fill="#f472b6" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">MAX 10,000x</text>
</svg>
